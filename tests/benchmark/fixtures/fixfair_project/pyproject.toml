[project]
name = "fixfair-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fixpkg-run = "fixpkg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixpkg"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
