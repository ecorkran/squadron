# Model benchmark answers, for lookup by an agent.
# Human version: SUMMARY.md. Evidence tables: RESULTS.md (section numbers below). Source of truth is the data files.
# confidence: high | medium | low. It describes the evidence, not the model.
# Dollars are API-equivalent on a subscription, not charges.
meta:
  updated: 20261123
  aliases_used: [haiku-xhigh, haiku, opus-high, opus-medium, sonnet-high, sonnet-medium, sonnet, fable-medium, fable-high, sol, sol-r, sol-high, luna, luna-r]
  design_cases: {mined: 43, flaws: 82, arch_flaws: 19, slice_flaws: 32, tasks_flaws: 31, need_code: 35, doc_alone: 29, doc_plus_parent: 18, material: 39, never_found_by_any_model: 14}
  design_cases_never_reviewed_by_a_model: {cases: [squadron-197-tasks, squadron-917-tasks], flaws: 4, why: the task gate returns its own FAIL for a merge step and no reviewer is called}
  code_cases: {original: 10, known_bugs: 14, new: 7, new_known_bugs: 7}
  code_public_benchmark: {name: Martian Code Review Bench, prs: 50, bug_type_golden_comments: 139, critical_or_high: 66, judge: Claude Sonnet 4.5 through OpenRouter, scored_from: finding titles}
  template_versions: "Document-review numbers dated before 20261122 are from squadron 0.24.31 templates. The 20261121 templates (#382, squadron 0.24.37) about doubled or tripled the code-needing flaws found (RESULTS 23), so the older numbers are stale for haiku-xhigh, sonnet-high, opus-high and fable-high and unknown for every other config."
  grading: Sonnet agents, blind, not checked by hand. Re-grading the same reviews matched (fable-medium 49 and 49, opus-high 44 and 43).
  not_in_repo: replay records in ~/.config/squadron/runs/replay-*.json (report kept in 20261117-writers/report-2026-11-17.txt)

recommendations:
  design_review:        # slice designs, task breakdowns, architecture
    default: haiku-xhigh
    second_pass: fable-medium
    cheap_second_pass: minimax31-flash   # OpenRouter, $0.04; 43 of 82 alone, 58 with haiku-xhigh; run 1 only, precision unmeasured
    cheap_alternatives: [hy4, mimo, qwen38-flash, glm-flash]   # 45, 38, 38, 37 of 82
    comb: none
    avoid: [sonnet-medium, sonnet, minimax, glm52, glm53, luna, luna-r-high, qwen38-27b]   # sonnet-high removed 20261123: on the current templates it finds 57 and 54 of 82
    confidence: medium
    why: "Current templates (RESULTS 23): haiku-xhigh 62 and 57 of 82 flaws at $0.33 a review; fable-high 67 at $3.06; opus-high 64 at $1.25; sonnet-high 57 and 54 at $0.45. Old templates: haiku-xhigh $0.34 per review tied dearer configs; haiku plus fable-medium found 66 of 82."
    current_templates_sets: "Of the 78 flaws a model saw: haiku-xhigh twice 68 ($0.66), haiku-xhigh plus sonnet-high 67 ($0.78), haiku-xhigh plus fable-high 72 ($3.39). second_pass and the cheap_ entries above were measured on the old templates only."
    caveats: precision is not measured; reviewers raise about 60% more findings on the current templates (haiku-xhigh 22 a review, sonnet-high 12, opus-high and fable-high 14)
    arch: "Architecture reviews did not improve on the current templates (10 to 15 of 19 flaws, as before). sonnet-high makes 5 to 6 tool calls on an architecture document. The key (19 flaws, 6 needing code) is too small to rank reviewers on architecture."
    evidence: [RESULTS 15, RESULTS 16, RESULTS 18, RESULTS 23]
  code_review:
    default: haiku-xhigh           # shipped: P6, implement, implement-plan, review.yaml
    candidate: haiku-xhigh plus a no-tools haiku line pass, findings in the behavior categories only   # slice 437, not built
    comb: none ending in opus-high   # PM 20261122, issue #389; the shipped comb prompt is truth-only
    avoid: [sonnet, sonnet-high, "recipes ending in an opus-high comb"]   # sonnet not rerun since grid 2
    confidence: medium-high        # two runs each, one judge model, one public benchmark
    why: "Public benchmark, recall / precision: pair 69.1% / 33.4% and 66.9% / 34.8% at $0.13 a review; haiku-xhigh alone 64.7% / 25.7% and 59.7% / 23.8% at $0.12; fable-high 64.0% / 27.5% at $1.43; sol-r 43.9% / 43.0%; the recipe with the opus-high comb 43.9% / 36.7%."
    evidence: [RESULTS 21, 20261122-martian/RESULTS.md]
  design_writing:
    best: fable-medium
    next: opus-high
    avoid: [haiku-xhigh, sonnet-high]
    confidence: medium
    evidence: [RESULTS 17]
  tasks_writing:
    best: [opus-high, fable-medium]
    avoid: [sonnet-high]
    confidence: low
    evidence: [RESULTS 17]
  arch_writing:
    best: unmeasured
    blocked_by: "issue #368 (sq replay has no arch phase)"
  pipeline_defaults_p4_p5_p6:
    status: set 2026-11-17 (commit 5cb15bc0) - reviewers haiku-xhigh; slice design writer fable-medium; arch and tasks writers opus-high; implementation writer still sonnet (unmeasured); issue #339 open until compared

answers:
  - id: worst_reviewer
    question: Which models are the weakest reviewers?
    answer: "Old templates: Sonnet at any effort. About 40% design recall against 47-57% for other Claude configs; 9-10 of 31 task flaws against 17-21. Last in the code grid too. Current templates (20261122): sonnet-high is no longer weak on documents, 57 and 54 of 82 against haiku-xhigh's 62 and 57, because it now reads (median 5 tool calls to 26). It still makes only 5 to 6 tool calls on architecture documents. Not rerun on code."
    confidence: high for the old templates; medium for the current ones
    evidence: [RESULTS 1, RESULTS 15, RESULTS 16, RESULTS 23]
  - id: code_review_public_benchmark
    question: How does squadron code review score on a public benchmark, and what is the best setup?
    answer: "Martian Code Review Bench, 139 bug-type golden comments, recall / precision. Best: haiku-xhigh plus a no-tools haiku line pass, behavior categories only, judged as one entry: 69.1% / 33.4% (55 of 66 critical or high, 191 false flags) and 66.9% / 34.8% (52 of 66, 174). haiku-xhigh alone 64.7% / 25.7% and 59.7% / 23.8%. fable-high 64.0% / 27.5% at $1.43 a review. sol-r 43.9% / 43.0%. Line pass alone 41.7% / 47.5% at $0.01. Outside tools on the same judge: augment 61.9% / 49.4%, copilot 61.9% / 31.4%, coderabbit 60.4% / 31.8%, cubic 59.7% / 52.9%, qodo-extended 58.3% / 53.6%, greptile 50.4% / 44.9%."
    confidence: medium-high
    caveats: one judge model; two runs for haiku-xhigh and the pair, one for the rest; one reviewer's run-to-run spread is about five points of recall and four critical items; precision counts real defects outside the key as false flags
    evidence: [RESULTS 21]
  - id: document_templates_reading
    question: Do document reviews find more when the templates make the reviewer open the code?
    answer: "Yes. Same 43 documents and key, stored reviews (squadron 0.24.31) against new ones (0.24.37, templates of 20261121). Flaws needing the code found, of 35: haiku-xhigh 13 to 27 and 24, sonnet-high 7 to 26 and 24, opus-high 9 to 26, fable-high 19 to 32. All flaws of 82: 42 to 62 and 57, 36 to 57 and 54, 43 to 64, 55 to 67. Document-only flaws did not move. Median tool calls rose three to five times; cost per review rose little (haiku-xhigh $0.23 to $0.33). The whole gain is in slice designs and task files; architecture reviews did not move."
    confidence: high on the direction; medium on the size
    caveats: one stored run; agent grades; two squadron versions, so it does not say which template change did the work; precision not measured and findings raised rose about 60%
    evidence: [RESULTS 23, RESULTS 22]
  - id: category_filter
    question: Should finding categories be filtered, and where?
    answer: "After the review. Keeping only the behavior categories (correctness, security-hygiene, error-handling-observability, consistency-rot, type-contract-debt) took haiku-xhigh from 64.7% / 25.7% to 60.4% / 37.0%; the other categories held 120 of its 260 false flags and 5 of its 90 hits. Telling the reviewer to report only behavior defects gave 53.2% / 37.6%: the same precision and ten fewer hits."
    confidence: medium
    caveats: one run each
    evidence: [RESULTS 21]
  - id: verifier_agreement
    question: Does agreement between verifier models separate real findings from false ones?
    answer: "No. opus-high, sol-r and fable-high each checked haiku-xhigh's 230 behavior findings with a truth-only prompt. All three kept 166: 72 golden hits and 93 that match no golden comment. Share matching the key: 45% at 3 of 3, 26% at 2, 25% at 1, 12% at 0. Agreement ranks; it does not filter. The 93 mean the benchmark's precision understates true precision; nobody has checked them by hand."
    confidence: medium
    evidence: [RESULTS 21]
  - id: reading_floor
    question: Do reviews that read little find less?
    answer: "On the old templates, yes for flaws that need the code: 0-3 tool calls 8% hit rate, 4-7 18%, 8-15 37%, 16-30 47%. On the current templates no slice-design or task review that called a model made fewer than 4 tool calls. The only low-reading model reviews are 8 sonnet-high architecture reviews, and they found 62% of their documents' flaws against 68% for architecture reviews with 11 or more calls."
    confidence: medium
    caveats: 19 architecture flaws, 6 needing the code
    evidence: [RESULTS 22, RESULTS 23, "issue #388"]
  - id: design_review_ranking
    question: Which model reviews designs best?
    answer: "Per run of 82 flaws: fable-medium 46.3, haiku-xhigh 43.7, opus-high 42.7, opus-medium 38.7, sonnet-high 33, sonnet-medium 32. The first three are inside the 3-6 flaw run-to-run spread. Over three runs the union is haiku-xhigh 58, fable-medium 55, opus-high 53, opus-medium 49."
    confidence: medium
    evidence: [RESULTS 16]
  - id: cheap_reviewers
    question: Are the cheap OpenRouter models usable as design reviewers?
    answer: "Yes, several. minimax31-flash finds 43 of 82 flaws for $0.04 a review (haiku-xhigh 44 for $0.24, fable-medium 50 for $2.27) and is best of all on slice designs (20 of 32). hy4 45 at $0.19. mimo 38 ($0.07), qwen38-flash 38 ($0.06), glm-flash 37 ($0.06; slice 19, tasks 10, arch 8), hy4-flash 32 ($0.01), mimo-flash 31 ($0.01). deepseek4-flash 33. No: glm52 19, minimax 13, qwen38-27b 27 at $0.15, luna-r-high 16. haiku-xhigh plus minimax31-flash 58 of 82 on run 1, equal to haiku-xhigh plus fable-medium; fable-medium plus minimax31-flash 63."
    confidence: medium
    caveats: one run each; precision not measured; grades are agent grades; minimax and glm52 returned no findings on 4 of 43 cases each
    evidence: [RESULTS 19, RESULTS 20]
  - id: expensive_and_openai_reviewers
    question: Do the dearer OpenRouter models and the OpenAI models earn a design-review slot?
    answer: "No, on a 15-case subset (22 flaws, one run each). glm53 6 at $0.40 a review, kimi3 12 at $0.32, qwen38 10 at $0.45, qwen38-max 13 at $0.74; hy4, mimo and minimax31-flash scored 13-14 at $0.04-0.19. OpenAI: sol 9, terra 9 (ChatGPT plan), terra-r 10 ($0.05), luna 2. haiku-xhigh and fable-medium scored 12 on the same cases."
    confidence: low
    caveats: 22 flaws; differences of one or two are noise; only glm53, luna and qwen38-27b are clearly weak
    evidence: [RESULTS 20]
  - id: design_review_value
    question: Best design reviewer per dollar?
    answer: haiku-xhigh. $0.34 per review against $0.79 (opus-medium), $0.96 (opus-high), $2.10 (fable-medium). It is slow, about 314 s median.
    confidence: high
    evidence: [RESULTS 15, RESULTS 16]
  - id: design_vs_code_review
    question: Do the same models lead design review and code review?
    answer: haiku-xhigh leads both. Otherwise they differ. Code (grid 2, 3 runs, 42 possible bug hits) - haiku-xhigh 16, sol 12, sonnet-high 7; precision haiku 24%, sol 79%. Design - sol found 2 of 25 flaws on 9 cases (one run); sonnet-high 2 there too. fable and opus were never run as code reviewers.
    confidence: medium
    evidence: [RESULTS 1, RESULTS 2, RESULTS 14]
  - id: combs_code
    question: Does a comb help code reviews?
    answer: "Not the opus-high comb as it was prompted. On our own 10 cases it kept 91% of REAL findings (49 of 54), all 14 known bugs, and dropped 93% of noise. On the public benchmark it dropped 29 of the 85 real hits luna-r had kept, 5 of them critical; in 28 of the 29 it agreed the claim was true and called it unlikely or minor. The prompt asked which findings should be fixed before merge. With a truth-only prompt (now the shipped comb.yaml) it dropped 10, all as disputes of fact. luna-r with the truth-only prompt on haiku-xhigh plus sol-r: 64.0% / 29.4%; with the old prompt 61.2% / 29.8%. PM decision 20261122: stop shipping recipes that end in an opus-high comb (#389), and do not drop real findings to raise a benchmark's precision."
    confidence: medium
    caveats: one run per reviewer; the two results are on different case sets and different scoring
    evidence: [RESULTS 5, RESULTS 21]
  - id: combs_design
    question: Does a comb help design reviews?
    answer: No. opus-high comb on 129 haiku-xhigh reviews drops 62% of findings (1393 to 531), precision 9% to 18%, but keeps only 78% of real findings, loses 7 of 58 distinct flaws, and costs about $1.00 a call, three times the review.
    confidence: medium-high
    caveats: precision is a lower bound (valid findings outside the 82 listed flaws count as noise); fable and pooled combs were skipped by decision
    evidence: [RESULTS 18]
  - id: pairs_of_reviewers
    question: Do two reviewers beat one?
    answer: Design - fable-medium plus haiku-xhigh 66 of 82 flaws over all runs; haiku-xhigh plus opus-high 66; fable plus opus-high 62; all four repeated configs 68; all six 68. Code - haiku-xhigh plus sol cover 8 of 14 known bugs, haiku 6, sol 5.
    confidence: medium
    evidence: [RESULTS 16, RESULTS 5]
  - id: repeat_runs
    question: Do repeat runs of one model help?
    answer: For haiku-xhigh on design, yes (58 flaws over three runs against 42 per run). On code, sol finds the same bugs every run; sol-high gains from repeats (2 to 4 known bugs).
    confidence: medium
    evidence: [RESULTS 16, RESULTS 13]
  - id: effort
    question: Does reasoning effort matter?
    answer: Opus - high 42.7 per run against medium 38.7 (design). Sonnet - no effect. Fable - high 52, medium 49 on one run, inside noise (medium spread 43-49). Sol and luna - high did not help on code.
    confidence: medium for opus; low for fable
    evidence: [RESULTS 15, RESULTS 16, RESULTS 17, RESULTS 3]
  - id: hardest_case_kind
    question: Which design document kinds are hardest to review?
    answer: "Old templates: slice designs - 25 of 32 flaws found by any model; arch 18 of 19, tasks 25 of 31; slice the weakest for every config. Current templates (stored to new, flaws found): slice designs haiku-xhigh 15 to 29 and 25 of 32, sonnet-high 14 to 26 and 26, opus-high 13 to 30, fable-high 18 to 30. Tasks of 31: 16 to 21 and 20, 10 to 20 and 18, 17 to 20, 22 to 22. Arch of 19: 11 to 12 and 12, 12 to 11 and 10, 13 to 14, 15 to 15. Slice designs are now the best covered and architecture is the kind that did not improve."
    confidence: medium
    evidence: [RESULTS 16, RESULTS 23]
  - id: design_writer
    question: Which model writes the best slice design?
    answer: fable-medium (14 wins, 2 losses, 3 ties over 19 pairs; strength 4.57), then opus-high (12-4-3, 2.77). The original design scores 1.38. sonnet-high (2-14-3) and haiku-xhigh (2-12-2) lose to the original. Cost per draft with a haiku reviewer and two rounds - fable $4.88, opus-high $3.47, sonnet-high $1.99, haiku-xhigh $0.95.
    confidence: medium
    caveats: five slices; judge opus-high is also a contestant; position consistency 84%
    evidence: [RESULTS 17]
  - id: tasks_writer
    question: Which model writes the best task breakdown?
    answer: opus-high (8 wins, 1 loss, 2 ties, 4 of 4 accepted) and fable-medium (5-0-2 on two drafts). haiku-xhigh 4-3-2, sonnet-high 1-5-0. Every writer except sonnet-high beat the original (1-10-0).
    confidence: low
    caveats: four slices; strength fit did not converge, use win-loss; position consistency 86%
    evidence: [RESULTS 17]

ideas:   # recipes and results not to lose
  line_pass_pair:
    recipe: haiku-xhigh with tools, plus plain haiku with no tools and the line-pass rules file; keep findings in the behavior categories from both; judge or act on them as one review
    result: "Public benchmark, two runs: 69.1% / 33.4% and 66.9% / 34.8%, $0.13 a review. Either run finds 105 of 139 (75.5%). The line pass alone is 41.7% / 47.5% for $0.01 and 20 seconds, and adds 11 golden comments to haiku-xhigh run 1, as many as fable-high did for $1.43."
    why_it_works: haiku-xhigh reads deeply (28 tool calls a review) and skips the line-by-line read; 14 of its 49 misses were slips nine or more outside tools found (a wrong variable, a function returning the unmodified value)
    rules_file: 20261122-martian/rules-line-pass.md
    status: not built as a recipe; slice 437 in user/architecture/420-slices.model-benchmark.md
    evidence: [RESULTS 21, 20261122-martian/RESULTS.md]
  templates_that_make_reviewers_read:
    idea: put the whole document in the prompt, say in the criteria to open the code and check what the document claims about it, and require a per-section list of what was checked (#382)
    result: code-needing flaws found doubled or tripled for every reviewer on slice designs and task files (RESULTS 23)
    status: shipped in 0.24.37 for slice, tasks and arch templates; which of the three changes did the work is not measured; no gain on arch
  truth_only_comb:
    idea: a comb or verifier is asked only whether the finding is true, never whether it is worth fixing
    status: shipped as comb.yaml (6778d02a)
    evidence: [RESULTS 21]
  haiku_sol_opus_comb:
    recipe: haiku-xhigh and sol in parallel, union their findings, comb with opus-high
    result: "10 original cases, run 1. Raw union 104 findings, 33 distinct real issues, 8 of 14 known bugs. After comb 45 findings, 30 real issues, 8 known bugs."
    luna_comb_instead: 65 findings, 33 real issues, 8 known bugs (keeps nearly all the noise)
    status: "withdrawn 20261122 (#389): on the public benchmark the shipped haiku-solr-luna-opus scored 43.9% recall against 64.7% for haiku-xhigh alone. The package now ships haiku-sol-luna and haiku-solr-luna."
    evidence: [RESULTS 5, 20261113-comb/out]
  two_stage_comb:
    recipe: luna-r comb, then opus-high comb on what it kept
    result: 89% precision, 12 of 14 known bugs kept (vs opus-high alone 84%, 14 of 14)
    caveat: recorded cost ($28.96) exceeds opus-high alone ($10.45) on fewer findings; unexplained, do not rely on it
    evidence: [RESULTS 5]
  haiku_review_then_opus_comb:
    result: 73 findings at 26% precision become 21 at 86%, all 6 known bugs kept (code)
    evidence: [RESULTS 5]
  pool_and_fan_out:
    idea: a recipe is fan-out reviewers, an optional random pool, and comb stages; score from stored outputs where no new call is needed
    status: designed in slice 430; not measured beyond the haiku plus sol union above
  batch_variants:
    idea: about half price, asynchronous; fits no-tool reviews, combs with pasted text, grading; not tool-using reviews
    status: squadron has no batch support
  design_comb_cheaper_model:
    status: not tried; opus-high comb on design reviews costs about $1.00 a call
  seeded_flaws:
    idea: plant known flaws in documents (mainly arch) to measure review recall without mining
    status: not built; arch review has 19 mined flaws only

not_measured:
  - arch writing (issue #368)
  - opus as a code reviewer (fable-high was measured 20261122, RESULTS 21)
  - document review precision (only recall measured; findings raised rose about 60% on the current templates)
  - whether an architecture review that reads little is worse (19 arch flaws in the key, 6 needing code)
  - the 93 verifier-confirmed code findings that match no golden comment (not checked by hand or against later fixes)
  - the line-pass pair under a second judge model (Opus 4.5 and GPT-5.2 judges not run) and on our own code
  - which of the 20261121 template changes did the work
  - every non-Claude and effort-variant document reviewer on the current templates
  - combs on fable-medium or pooled design reviews (skipped by decision)
  - implementation writers (which model writes the best code for P6)
  - defaults for P4, P5, P6 pipelines against the old ones (issue #339)
  - judge other than opus-high for writers

known_limits:
  - Sonnet-agent grading unchecked by hand; consistent on re-grade.
  - 4 of 43 mined cases come from response edits where the original reviewer raised the flaws.
  - Writer judge is also a contestant (opus-high).
  - Code grids are mostly one run per config; the code comb uses run 1.
  - 14 of 82 design flaws were found by no model, a recall ceiling.

