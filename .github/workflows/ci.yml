name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # A tag checkout leaves HEAD detached with no local `main` ref
      # (full history via fetch-depth:0 covers commits, not branch refs).
      # Tests resolve --diff against real refs like `main`, so ensure it
      # exists locally regardless of what triggered this run.
      - run: git fetch origin main:main || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @context-forge/cli
      - run: cf init --lite --no-ide
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: cf validate frontmatter
      - run: uv run pytest

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install 3.12
      - run: uv sync
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
      - uses: pypa/gh-action-pypi-publish@release/v1
