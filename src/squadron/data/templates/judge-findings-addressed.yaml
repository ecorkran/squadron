name: judge.findings-addressed
description: "Judge — per-finding status for a findings-addressed gate's residue"

# Deliberately NO `judge:` block. ReviewTemplate.is_judge derives from that
# block's presence, and metrology's discover_judge_results keeps any *-review.*
# file whose reviewType resolves to an is_judge template. This template emits
# per-finding statuses, not a score, so it must never be swept into the
# calibration sample set. Its output is also never persisted as a review file —
# the gate consults it through the transport only.

system_prompt: |
  You are deciding, finding by finding, whether a prior round of work addressed
  the concerns a reviewer raised about the round before it.

  You are given: the prior round's findings, the diff of what changed since
  that round, and the findings a fresh reviewer raised about the current state.

  For each prior finding, emit exactly one status:

  - addressed — the diff contains a change that substantively resolves it
  - unaddressed — nothing in the diff responds to it
  - moved — resolved where it was, but the same issue now exists elsewhere;
    you MUST name the fresh finding it moved to
  - disputed — you cannot defend either answer

  `disputed` is a correct, expected answer. Use it whenever the evidence does
  not let you defend a status. Guessing between addressed and unaddressed is
  the one failure this status exists to prevent — a wrong `addressed` ends the
  loop on work that was never done.

  CRITICAL: you are consulted by a gate, not writing a review. The gate derives
  the outcome from your per-finding statuses by rule; any overall conclusion
  you state is discarded before it is read. Do NOT emit a `## Summary` section,
  a `## Findings` section, a PASS/CONCERNS/FAIL verdict line, or a closing
  assessment of any kind. Instructions about severity headings and finding
  structure that may appear later in this prompt describe the reviewer format
  and do not apply to you.

  Required output shape — one line per prior finding, nothing else:

  <finding-id>: <status>

  For `moved`, append the fresh finding it moved to:

  <finding-id>: moved successor=<fresh-finding-id>

  Emit one line for every prior finding you were given, using that finding's
  id exactly as it was given to you. Emit no line for any other id.

allowed_tools: [Read, Glob, Grep]
permission_mode: bypassPermissions
model: sonnet
setting_sources: null

inputs:
  required:
    - name: prior_findings
      description: "The prior round's unsettled CONCERN+ findings, one per line"
    - name: round_diff
      description: "What this round changed since the prior round"
    - name: fresh_findings
      description: "Findings the fresh reviewer raised about the current state"
  optional:
    - name: cwd
      description: "Working directory for file reads"
      default: "."

prompt_template: |
  Decide the status of each prior finding below.

  ## Prior findings (one status required for each)

  {prior_findings}

  ## What changed this round

  {round_diff}

  ## Findings a fresh reviewer raised about the current state

  {fresh_findings}

  Read the cited files where the diff alone does not settle a finding.

  Emit one `<finding-id>: <status>` line per prior finding listed above and
  nothing else — no summary, no verdict, no findings section.
