# Built-in model aliases for squadron.
# Format is identical to ~/.config/squadron/models.toml — users can copy
# entries directly between the two files.
#
# Fields:
#   profile    (required) — provider profile name
#   model      (required) — full model identifier
#   private    (optional) — bool; true = not shown in public listings
#   cost_tier  (optional) — "subscription" | "cheap" | "moderate" | "expensive"
#   notes      (optional) — free-form human-readable note
#   tool_use   (optional) — bool; false = never offer tool schemas to this
#                model. Absent means allow, so omitting it keeps current
#                behavior. Set it on models whose tool calling is unreliable.
#   max_output_tokens (optional) — integer >= 1; sent as max_completion_tokens
#                on each request of an OpenAI-compatible agent. Absent means no
#                budget is sent and the backend default applies. Built-in
#                OpenRouter values are top_provider.max_completion_tokens from
#                https://openrouter.ai/api/v1/models, read 20260927; aliases
#                the listing reports null or omits stay unset.
#   effort     (optional) — "none" | "low" | "medium" | "high" | "xhigh"; the
#                reasoning effort sent on every request (reasoning_effort on an
#                OpenAI-compatible agent, effort on the SDK; "none" disables
#                reasoning). Absent means none is sent and the backend default
#                applies. No built-in alias sets it: define a variant such as
#                glm-flash-low in ~/.config/squadron/models.toml instead.
#   [aliases.<name>.pricing]  (optional sub-table)
#     input, output, cache_read, cache_write — USD per 1M tokens
#
# Deprecated: `kimi25` (moonshotai/kimi-k2) is no longer shipped. Use `kimi27`
# (moonshotai/kimi-k2.7-code) in tests and examples.
#
# Deprecated: `qwen36-free` (qwen/qwen3.6-plus:free) is no longer shipped; it is
# gone from OpenRouter's model listing (20260927).
#
# Renamed (20260928): `glmflash` → `glm-flash`, matching the other `-flash`
# aliases. `flash3` and `flash3-lite` are replaced by `gemini-flash`.

