name: P2
description: Design an architectural initiative (phase 2) with arch review

params:
  plan: required
  model: opus
  review-model: glm52
  summary-model: sonnet

steps:
  - design:
      phase: 2
      plan: "{plan}"
      model: "{model}"
      review:
        template: arch
        model: "{review-model}"

  - summary:
      template: minimal-sdk
      model: "{summary-model}"
      emit: [stdout, file]
