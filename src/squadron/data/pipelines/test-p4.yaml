name: P4
description: Design a slice (phase 4) with review and human checkpoint

params:
  slice: required
  model: kimi27
  review-model: minimax

steps:
  - design:
      phase: 4
      model: "{model}"
      allowed_tools: [read_file, write_file]
      review:
        template: slice
        model: "{review-model}"

  - summary:
      template: minimal-sdk
      model: minimax
      emit: [stdout, clipboard, file]

