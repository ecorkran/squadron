name: P56
description: Tasks through implementation (phases 5-6) — tasks revised until review passes, then implement

params:
  slice: required
  model: sonnet
  review-model: minimax
  max-revisions: "3"
  pass-threshold: review.pass
  accept-threshold: review.concerns_or_better

steps:
  - tasks:
      phase: 5
      model: "{model}"
      review: { template: tasks, model: "{review-model}" }
      checkpoint: never
  - loop:
      name: revise-tasks
      max: "{max-revisions}"
      until: "{pass-threshold}"
      accept_if: "{accept-threshold}"
      skip_if_met: true
      commit_each_iteration: true
      on_exhaust: checkpoint
      steps:
        - dispatch: { name: revise, model: "{model}", feedback: review }
        - review: { template: tasks, model: "{review-model}", slice: "{slice}" }

  - summary:
      template: minimal-sdk
      model: minimax
      emit: [file]

  - compact:

  - summary:
      restore: true

  - implement:
      phase: 6
      model: "{model}"
      review: { template: code, model: "{review-model}" }
      checkpoint: on-fail

  - summary:
      template: minimal-sdk
      model: minimax
      emit: [file]

  - compact:

  - summary:
      restore: true

  - devlog: auto
