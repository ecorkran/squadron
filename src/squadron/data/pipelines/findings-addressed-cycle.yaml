name: findings-addressed-cycle
description: Fix-review cycle that exits only when fresh eyes pass AND the prior round's findings were accounted for

params:
  slice: required
  model: sonnet
  max-revisions: "2"
  review-model: minimax
  judge-model: sonnet

steps:
  # Review first: the revise step needs findings to work from.
  - review:
      template: slice
      model: "{review-model}"
      slice: "{slice}"
  - loop:
      max: "{max-revisions}"
      until: review.pass
      # The policy's evidence source: without a per-round commit there is no
      # prior round to compare against, and loop validation rejects the shape.
      commit_each_iteration: true
      steps:
        - dispatch:
            name: revise
            model: "{model}"
            feedback: review

        # Assessor — structurally blind to prior rounds.
        - review:
            name: fresh-review
            template: slice
            model: "{review-model}"
            slice: "{slice}"

        # Decider — sees both rounds. Deterministic screens first; a judge is
        # consulted only for findings they cannot settle.
        - gate:
            name: settled
            review_from: fresh-review
            policy: findings-addressed
            judge:
              model: "{judge-model}"
            checkpoint: on-concerns
