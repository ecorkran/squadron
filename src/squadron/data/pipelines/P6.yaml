name: P6
description: Implement slice (phase 6) with review

params:
  slice: required
  summary-model: sonnet
  model: sonnet
  # review-model: haiku-xhigh finds the most known bugs of the single reviewers measured
  # (16 of 42) but about 76% of what it raises is minor. sol (OpenAI, needs a Codex login or
  # an API key) finds 12 of 42 at 79% precision. Together they cover more (8 of 14 known bugs
  # on the 10-case set, against 6 and 5), and an opus-high comb over the union drops 57% of
  # the findings while keeping all 8. A review step takes one model, so this default is
  # haiku-xhigh alone; with an OpenAI account or key, `review-model: sol` is the cleaner
  # single reviewer. Data: project-documents/user/reference/review-recall-results/SUMMARY.md.
  review-model: haiku-xhigh
  max-revisions: "2"
  pass-threshold: review.pass
  accept-threshold: review.concerns_or_better
  merge: "true"

steps:
  - branch: { op: enter }
  - implement:
      phase: 6
      model: "{model}"
      review: { template: code, model: "{review-model}" }
      checkpoint: never
      existing: keep
  - dispatch:
      name: close-out
      model: "{model}"
      prompt: "Close out the task file for this slice. The current git branch name starts with the slice index; the task file(s) are the files in project-documents/user/tasks/ whose names start with that index. Compare each task item against the branch's diff from the target branch and check off ONLY the items the diff shows are done. Use the task-checker agent if it is available; otherwise edit the checkboxes directly. Never check off an item you cannot verify in the diff. Leave a task unchecked when it is unfinished, or when work stopped at a point that needs the Project Manager. Commit the task file change."
  - loop:
      name: revise-code
      max: "{max-revisions}"
      until: "{pass-threshold}"
      accept_if: "{accept-threshold}"
      skip_if_met: true
      commit_each_iteration: true
      on_exhaust: checkpoint
      steps:
        - dispatch: { name: revise, model: "{model}", feedback: review }
        - review: { template: code, model: "{review-model}", slice: "{slice}" }
  - devlog: auto
  - branch: { op: merge, when: "{merge}" }

  - summary:
      template: minimal-sdk
      model: "{summary-model}"
      emit: [stdout, clipboard, file]
