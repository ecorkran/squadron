name: tasks-plan
description: Break down every designed slice in a plan whose design review is acceptable; flag failures, report at end

params:
  plan: required
  model: sonnet
  review-model: glm-flash
  max-revisions: "2"
  pass-threshold: review.pass
  accept-threshold: review.concerns_or_better

steps:
  - each:
      name: slices
      source: cf.slices_needing_tasks("{plan}", "{accept-threshold}")
      as: slice
      on_item_failure: continue
      steps:
        # Each slice starts in a fresh SDK session carrying nothing from the previous one.
        # First in the body so a failed item can't leak into the next. Skipped (no model
        # call) when the model is non-SDK and there is no session (#148).
        - summary: { template: item-reset, model: "{model}", emit: [rotate] }
        - tasks:
            phase: 5
            plan: "{plan}"
            slice: "{slice.index}"
            model: "{model}"
            review: { template: tasks, model: "{review-model}" }
            checkpoint: never
        - loop:
            max: "{max-revisions}"
            until: "{pass-threshold}"
            accept_if: "{accept-threshold}"
            skip_if_met: true
            commit_each_iteration: true
            steps:
              - dispatch: { name: revise, model: "{model}", feedback: review }
              - review: { template: tasks, model: "{review-model}", slice: "{slice.index}" }
