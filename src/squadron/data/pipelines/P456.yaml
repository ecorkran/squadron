name: P456
description: Full slice lifecycle (phases 4-6) — design and tasks each revised until review passes, then implement

params:
  slice: required
  summary-model: sonnet
  design-model: opus
  model: sonnet
  review-model: deepseek4-flash
  max-revisions: "2"
  pass-threshold: review.pass
  accept-threshold: review.concerns_or_better

steps:
  - design:
      phase: 4
      model: "{design-model}"
      review: { template: slice, model: "{review-model}" }
      checkpoint: never
  - loop:
      name: revise-design
      max: "{max-revisions}"
      until: "{pass-threshold}"
      accept_if: "{accept-threshold}"
      skip_if_met: true
      commit_each_iteration: true
      on_exhaust: checkpoint
      steps:
        - dispatch: { name: revise, model: "{design-model}", feedback: review }
        - review: { template: slice, model: "{review-model}", slice: "{slice}" }

  - tasks:
      phase: 5
      model: "{model}"
      review: { template: tasks, model: "{review-model}" }
      checkpoint: never
  - loop:
      name: revise-tasks
      max: "{max-revisions}"
      until: "{pass-threshold}"
      accept_if: "{accept-threshold}"
      skip_if_met: true
      commit_each_iteration: true
      on_exhaust: checkpoint
      steps:
        - dispatch: { name: revise, model: "{model}", feedback: review }
        - review: { template: tasks, model: "{review-model}", slice: "{slice}" }

  - summary:
      template: minimal-sdk
      model: "{summary-model}"
      emit: [file]

  - compact:

  - summary:
      restore: true

  - branch: { op: enter }
  - implement:
      phase: 6
      model: "{model}"
      review: { template: code, model: "{review-model}" }
      checkpoint: never
      existing: keep
  - loop:
      name: revise-code
      max: "{max-revisions}"
      until: "{pass-threshold}"
      accept_if: "{accept-threshold}"
      skip_if_met: true
      commit_each_iteration: true
      on_exhaust: checkpoint
      steps:
        - dispatch: { name: revise, model: "{model}", feedback: review }
        - review: { template: code, model: "{review-model}", slice: "{slice}" }
  - devlog: auto
  - branch: { op: merge }
