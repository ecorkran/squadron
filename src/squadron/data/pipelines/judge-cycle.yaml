name: judge-cycle
description: Judge-gated review-fix-review cycle — bounded loop that auto-advances on a passing score or escalates to a human at max iterations

params:
  slice: required
  model: sonnet
  review-model: minimax

steps:
  # Judge first: the fix step needs findings to work from.
  - review:
      template: judge.slice-vs-arch
      model: "{review-model}"
      slice: "{slice}"
  - loop:
      max: 3
      until: review.pass
      skip_if_met: true
      on_exhaust: checkpoint
      steps:
        - dispatch:
            name: revise
            model: "{model}"
            feedback: review
        - review:
            template: judge.slice-vs-arch
            model: "{review-model}"
            slice: "{slice}"
